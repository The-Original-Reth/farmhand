server {
    listen 3636;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The page itself is always checked with the server, so a rebuilt Farmhand shows at once instead of the copy the
    # browser kept. The files it loads have their content in their names, so they can be kept for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # A camera played through go2rtc (a Buddy3D's): the browser's websocket to it, for Farmhand's own streams only
    # (farmhand_<printer id>), so the rest of go2rtc's API stays out of reach. go2rtc is looked up when asked for, so
    # this page still works while its container is down.
    location = /go2rtc/api/ws {
        if ($arg_src !~ "^farmhand_[0-9]+$") {
            return 403;
        }
        resolver 127.0.0.11 valid=30s;
        set $go2rtc go2rtc:1984;
        proxy_pass http://$go2rtc/api/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;  # go2rtc only takes a websocket from the address the page came from
        proxy_read_timeout 1h;
    }

    # A plugin's page, shown inside Farmhand: /plugins/<id>/... goes to the API's /plugins/<id>/page/..., which passes
    # it on to the plugin at its address (another machine, or a container beside this one) and says so when it isn't
    # running. The API is looked up when asked for, so this page still loads while the API restarts. The bare /plugins
    # is the Plugins page (below); /plugins/farmhand-plugin.js is the script plugin pages load.
    location ^~ /plugins/ {
        resolver 127.0.0.11 valid=30s;
        set $farmhand_api api:4545;
        rewrite ^/plugins/([a-z0-9-]+)/(.*)$ /plugins/$1/page/$2 break;
        proxy_pass http://$farmhand_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;  # a page's server-sent events arrive as they're sent
        proxy_read_timeout 1h;
        client_max_body_size 50m;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
