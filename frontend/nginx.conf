server {
    listen 3636;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The page itself is always checked with the server, so a rebuilt Farmhand shows at once instead of the copy the
    # browser kept. The files it loads have their content in their names, so they can be kept for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
