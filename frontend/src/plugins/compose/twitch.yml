# Farmhand's Twitch plugin: the farm's cameras streamed live to Twitch, in a container of its own, so a Farmhand
# update, restart or crash never stops it. It's independent of the YouTube Stream plugin: its own layout, cameras,
# pictures and music, and it can run beside it on the same machine. Put this file in a folder of its own on any
# machine on the farm's network that has Docker and reaches the cameras and Farmhand (e.g. /opt/farmhand-twitch), then,
# in that folder:
#
#   sudo docker compose up -d --build
#
# Docker builds the plugin straight from its GitHub repository (git must be installed). Then add it on
# Farmhand's Plugins page at http://<this machine>:8081, put the two lines Farmhand shows into twitch.env (beside this
# file) and start it again:  sudo docker compose up -d --force-recreate
services:
  twitch:
    build: https://github.com/The-Original-Reth/farmhand-twitch-plugin.git#main
    image: farmhand-twitch
    container_name: farmhand-twitch
    restart: unless-stopped        # back by itself after a reboot or a crash (and live again, if it was)
    # The plugin connects to its save location on the NAS itself (set on its settings, shown on Farmhand's Settings
    # page under its name): mounting needs SYS_ADMIN, and SMB also DAC_READ_SEARCH, as Farmhand's own container has;
    # AppArmor's default profile would block it on hosts that run AppArmor.
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    ports:
      - "8081:8080"                # Farmhand reaches the plugin at http://<this machine>:8081 (8080 is left for the
                                   # YouTube Stream plugin). Something else on 8081 here: change the left side only
    env_file:
      - path: twitch.env           # FARMHAND_URL and FARMHAND_TOKEN, from Farmhand's Plugins page
        required: false            # (not there until then)
    volumes:
      - twitch-data:/data          # its settings, Twitch stream key and saved layouts
      # The two below are used only until a save location is set on the plugin's settings: from then on its folders
      # on the NAS are used, and these can be left as they are.
      - ./media:/media             # the stream folder: pictures, slideshows and music
      - ./clips:/clips             # where Save clip puts its MP4s
    # environment:
    #   STREAM_FOLDER_SHOWN_AS: '\\nas\share\Farmhand\twitch'    # the stream folder as people reach it, shown on the page
    #   STREAM_CLIPS_SHOWN_AS: '\\nas\share\Farmhand\Twitch clips'   # the clips folder as people reach it, on the page
    #   FARMHAND_STREAM_ENCODER: auto                            # auto (default), nvenc or cpu

    # An NVIDIA card: the stream is compressed on the card, leaving the processor for the cameras. The machine needs
    # the NVIDIA driver's libraries (on a Proxmox container, at the host's driver version). Remove the # signs below.
    # devices:
    #   - /dev/nvidia0
    #   - /dev/nvidiactl
    #   - /dev/nvidia-uvm
    #   - /dev/nvidia-uvm-tools
    # and add these under volumes: above
    #   - /usr/lib/x86_64-linux-gnu/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so.1:ro
    #   - /usr/lib/x86_64-linux-gnu/libnvidia-encode.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-encode.so.1:ro
    #   - /usr/lib/x86_64-linux-gnu/libnvcuvid.so.1:/usr/lib/x86_64-linux-gnu/libnvcuvid.so.1:ro

volumes:
  twitch-data:
